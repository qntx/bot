# cargo-deny configuration for the ovo workspace.
#
# Run with `cargo deny check` to enforce supply-chain hygiene:
# - advisories: every transitive dependency must be free of known CVEs
# - bans:       the workspace ships exactly one version of every crate
# - licenses:   only permissive licenses are allowed
# - sources:    only crates.io is trusted

[graph]
all-features        = true
no-default-features = false

[output]
feature-depth = 1

[advisories]
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]
yanked  = "deny"
# Unmaintained, not vulnerable; transitive-only and not removable:
#   paste (RUSTSEC-2024-0436)          via specta-macros / tauri-specta
#   proc-macro-error (RUSTSEC-2024-0370) via glib-macros (Linux GTK tree)
ignore = ["RUSTSEC-2024-0436", "RUSTSEC-2024-0370"]

[licenses]
# BSD-2-Clause: Inflector via specta-macros. Apache-2.0 WITH LLVM-exception:
# target-lexicon via cfg-expr → system-deps (GTK build deps).
allow                = ["MIT", "Apache-2.0", "BSD-2-Clause", "BSD-3-Clause", "CDLA-Permissive-2.0", "MPL-2.0", "Unicode-3.0", "Zlib", "Apache-2.0 WITH LLVM-exception"]
confidence-threshold = 0.93
# MIT-0 (public-domain-equivalent): borrow-or-share via jsonschema/referencing.
exceptions = [{ crate = "borrow-or-share", allow = ["MIT-0"] }]

[bans]
multiple-versions = "warn"
wildcards         = "deny"
highlight         = "all"
allow             = []
deny              = []
skip              = []
skip-tree         = []

[sources]
unknown-registry = "deny"
unknown-git      = "deny"
allow-registry   = ["https://github.com/rust-lang/crates.io-index"]
allow-git        = []
