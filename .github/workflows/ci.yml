name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    uses: qntx/workflows/.github/workflows/ci-bun.yml@v2
    permissions:
      contents: read
    with:
      # bun run lint → vp check + taplo + version lockstep +
      # scripts/check-layers.ts (cargo tree on ovo-ai --no-default-features)
      rust: true
    # bun run typecheck / build / test → vp run -r across the workspace

  rust:
    uses: qntx/workflows/.github/workflows/ci-rust.yml@v2
    permissions:
      contents: read
    with:
      # rust-version omitted: rust-toolchain.toml pins the toolchain.
      deny: true
      doc: true
      # Tauri dev-time system libraries (Linux runner).
      apt-packages: libwebkit2gtk-4.1-dev libxdo-dev libayatana-appindicator3-dev librsvg2-dev

  no-default-features:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p ovo-ai --no-default-features

  vectors:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v4
        with:
          # Vectors record the generating Node version; this pins it.
          node-version-file: .node-version
      - run: bun install --frozen-lockfile
      - run: bun run vectors:generate
      - run: git diff --exit-code vectors/
