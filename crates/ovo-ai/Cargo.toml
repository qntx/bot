[package]
name        = "ovo-ai"
description = "Unified multi-provider LLM API for the ovo agent harness"

version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
repository.workspace   = true
homepage.workspace     = true
authors.workspace      = true

[dependencies]
serde.workspace       = true
serde_json            = { workspace = true, features = ["preserve_order", "float_roundtrip"] }
ryu-js.workspace      = true
thiserror.workspace   = true
tokio                 = { workspace = true, features = ["sync", "rt", "time", "macros"] }
tokio-util            = { workspace = true }
url                   = { workspace = true }
bytes                 = { workspace = true }
reqwest               = { workspace = true, optional = true }
futures.workspace     = true
regex.workspace       = true
jsonschema.workspace  = true
referencing.workspace = true

[dev-dependencies]
wiremock           = "0.6.5"
tokio              = { workspace = true, features = ["test-util", "macros", "rt"] }
proptest.workspace = true

[lints]
workspace = true

[features]
default = ["http"]
http    = ["dep:reqwest"]
